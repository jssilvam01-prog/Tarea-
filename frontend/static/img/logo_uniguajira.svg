<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="42" height="42">
  <defs>
    <linearGradient id="uniguajiraGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#006837" />
      <stop offset="100%" stop-color="#004d28" />
    </linearGradient>
  </defs>
  <!-- Base circular institucional -->
  <circle cx="60" cy="60" r="56" fill="url(#uniguajiraGrad)" stroke="#FFFFFF" stroke-width="3" />
  <circle cx="60" cy="60" r="48" fill="none" stroke="#F1C40F" stroke-width="1.5" stroke-dasharray="3,2" />
  
  <!-- Rayos de sol / Sabiduría (Sol Guajiro) -->
  <g fill="#F1C40F">
    <polygon points="60,20 62,32 58,32" />
    <polygon points="60,100 62,88 58,88" />
    <polygon points="20,60 32,62 32,58" />
    <polygon points="100,60 88,62 88,58" />
    <polygon points="32,32 42,40 39,43" />
    <polygon points="88,88 78,80 81,77" />
    <polygon points="88,32 80,42 77,39" />
    <polygon points="32,88 40,78 43,81" />
  </g>
  
  <!-- Escudo heráldico central -->
  <path d="M42,42 L78,42 C78,42 78,65 60,78 C42,65 42,42 42,42 Z" fill="#FFFFFF" stroke="#F1C40F" stroke-width="2" />
  
  <!-- Partición interna del escudo -->
  <path d="M44,44 L76,44 L76,55 L44,55 Z" fill="#006837" />
  
  <!-- Libro abierto / Conocimiento -->
  <path d="M50,49 Q60,47 60,52 Q60,47 70,49 L70,53 Q60,51 60,54 Q60,51 50,53 Z" fill="#FFFFFF" />
  
  <!-- Cactus / Tierra de La Guajira -->
  <path d="M59,60 L61,60 L61,72 L59,72 Z" fill="#006837" />
  <path d="M55,63 L59,63 L59,65 L56,65 L56,68 L59,68" fill="none" stroke="#006837" stroke-width="1.2" />
  <path d="M65,65 L61,65 L61,67 L64,67 L64,70 L61,70" fill="none" stroke="#006837" stroke-width="1.2" />
</svg>
